binary_sensor:
  - platform: ratgdo
    type: motion
    id: ${id_prefix}_motion
    ratgdo_id: ${id_prefix}
    name: "Motion"
    device_class: motion

  - platform: ratgdo
    type: obstruction
    id: ${id_prefix}_obstruction
    ratgdo_id: ${id_prefix}
    name: "Obstruction"
    device_class: problem

  - platform: ratgdo
    type: button
    id: ${id_prefix}_button
    ratgdo_id: ${id_prefix}
    name: "Button"
    entity_category: diagnostic

  - platform: ratgdo
    type: motor
    id: ${id_prefix}_motor
    ratgdo_id: ${id_prefix}
    name: "Motor"
    device_class: running
    entity_category: diagnostic

# Optional Add-on ToF Sensor
#  - platform: ratgdo
#    ratgdo_id: ${id_prefix}
#    id: ${id_prefix}_vehicle_detected
#    type: vehicle_detected
#    name: "Vehicle State Detected"

#  - platform: ratgdo
#    ratgdo_id: ${id_prefix}
#    id: ${id_prefix}_vehicle_arriving
#    type: vehicle_arriving
#    name: "Vehicle State Arriving"

#  - platform: ratgdo
#    ratgdo_id: ${id_prefix}
#    id: ${id_prefix}_vehicle_leaving
#    type: vehicle_leaving
#    name: "Vehicle State Leaving"

  - platform: gpio
    id: "${id_prefix}_dry_contact_open"
    pin:
      number: ${dry_contact_open_pin}  #  dry contact for opening door
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Dry contact open"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            binary_sensor.is_off: ${id_prefix}_dry_contact_close
          then:
            - cover.open: ${id_prefix}_garage_door
  - platform: gpio
    id: "${id_prefix}_dry_contact_close"
    pin:
      number: ${dry_contact_close_pin}  # dry contact for closing door
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Dry contact close"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            binary_sensor.is_off: ${id_prefix}_dry_contact_open
          then:
            - cover.close: ${id_prefix}_garage_door
  - platform: gpio
    id: "${id_prefix}_dry_contact_light"
    pin:
      number: ${dry_contact_light_pin}  # dry contact for triggering light
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Dry contact light"
    entity_category: diagnostic
    on_press:
      - light.toggle: ${id_prefix}_light

number:
  - platform: ratgdo
    id: ${id_prefix}_rolling_code_counter
    type: rolling_code_counter
    entity_category: config
    ratgdo_id: ${id_prefix}
    name: "Rolling code counter"
    mode: box
    unit_of_measurement: "codes"

  - platform: ratgdo
    id: ${id_prefix}_opening_duration
    type: opening_duration
    entity_category: config
    ratgdo_id: ${id_prefix}
    name: "Opening duration"
    unit_of_measurement: "s"

  - platform: ratgdo
    id: ${id_prefix}_closing_duration
    type: closing_duration
    entity_category: config
    ratgdo_id: ${id_prefix}
    name: "Closing duration"
    unit_of_measurement: "s"

  - platform: ratgdo
    id: ${id_prefix}_client_id
    type: client_id
    entity_category: config
    ratgdo_id: ${id_prefix}
    name: "Client ID"
    mode: box

# Optional TTC
  - platform: ratgdo
    id: ${id_prefix}_time_to_close
    type: time_to_close
    entity_category: config
    ratgdo_id: ${id_prefix}
    name: "Time to close"
    mode: box
    unit_of_measurement: "s"

switch:
  - platform: ratgdo
    id: ${id_prefix}_close_notification
    type: close_notification
    ratgdo_id: ${id_prefix}
    name: "Close Notification"
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:bell-alert"

  - platform: ratgdo
    id: ${id_prefix}_invert_obstruction
    type: invert_obstruction
    ratgdo_id: ${id_prefix}
    name: "Invert Obstruction"
    restore_mode: RESTORE_DEFAULT_OFF

# Optional Add-on ToF Sensor
#  - platform: ratgdo
#    id: ${id_prefix}_target_distance_measurement
#    type: target_distance_measurement
#    entity_category: config
#    ratgdo_id: ${id_prefix}
#    name: "Vehicle Distance Target"
