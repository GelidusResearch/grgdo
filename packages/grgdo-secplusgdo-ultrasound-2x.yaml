esphome:
  min_version: 2026.2.0

external_components:
  - source: github://gelidusresearch/esphome-secplus-gdo@master
    components: [ secplus_gdo ]
    refresh: always
  # - source:
  #     type: local
  #     path: components

sensor:
  - platform: ultrasonic
    id: gdo_ultra_distance1
    trigger_pin: ${aux1_pin4}
    echo_pin: ${aux1_pin5}
    name: "Vehicle 1 Distance"
    timeout: 3.5m
    update_interval: 1s
    filters:
        - lambda: return x * 100.0;
    unit_of_measurement: "cm"

  - platform: ultrasonic
    id: gdo_ultra_distance2
    trigger_pin: ${aux2_pin4}
    echo_pin: ${aux2_pin5}
    name: "Vehicle 2 Distance"
    timeout: 3.5m
    update_interval: 1s
    filters:
      - lambda: return x * 100.0;
    unit_of_measurement: "cm"
