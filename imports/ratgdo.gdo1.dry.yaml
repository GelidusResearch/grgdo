# GDO setup guide ver 2026.08.10
# The VL53L1X ToF Sensor on RATGDO firmmare requires the GelidusResearch Repo
external_components:
  - source:
      type: git
      url: https://github.com/gelidusresearch/esphome-ratgdo.git
      ref: 1.3.1
    components: [ ratgdo ]
    refresh: 0s

substitutions:
  id_prefix: gdo1
  friendly_name: "GDO1"
  uart_tx_pin: GPIO22           # J4 Pin 1 Red or 3 Blue to Opener Red CTRL terminal
  uart_rx_pin: GPIO21           # J4 Pin 1 Red or 3 Blue to Opener Red CTRL terminal
  input_obst_pin: GPIO23        # J4 Pin 4 Grey OBST
  dry_contact_open_pin: GPIO18  # J4 Pin 6 Green
  dry_contact_close_pin: GPIO19 # J4 Pin 7 Blue
  dry_contact_light_pin: GPIO17 # J4 Pin 8 Orange
  tof_sda_pin: GPIO26           # GPIO26 = v2 board, GPIO3 = v1 board
  tof_scl_pin: GPIO25           # GPIO25 = v2 board, GPIO1 = v1 board


esphome:
  name: ${id_prefix}
  friendly_name: ${friendly_name}
  project:
    name: Gelidus Research.Garage Door Controller
    version: "1.0"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  baud_rate: 115200
  
# Enable Home Assistant API
api:


ota:
  - platform: esphome
  - platform: web_server

wifi:
  power_save_mode: none
  ap:

captive_portal:
improv_serial:
web_server:
safe_mode:

preferences:
  flash_write_interval: 15min

ratgdo:
  id: ${id_prefix}
  input_gdo_pin: ${uart_rx_pin}
  output_gdo_pin: ${uart_tx_pin}
  input_obst_pin: ${input_obst_pin}
  dry_contact_open_sensor: ${id_prefix}_dry_contact_open
  dry_contact_close_sensor: ${id_prefix}_dry_contact_close
  discrete_open_pin: GPIO33 #Dummy pin prevents code exceptions, unchecked in cg
  discrete_close_pin: GPIO32 #Dummy pin prevents code exceptions, unchecked in cg
  protocol: drycontact

sensor:
  - platform: ratgdo
    id: ${id_prefix}_openings
    type: openings
    entity_category: diagnostic
    ratgdo_id: ${id_prefix}
    name: "Openings"
    unit_of_measurement: "openings"
    icon: mdi:open-in-app
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    id: wifi_signal_db
    update_interval: 30s
    entity_category: "diagnostic"
  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Strength"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

